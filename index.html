<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZYNO | Premium Clothing</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#f5f5f5;
  color:#111;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#000;
  color:#fff;
  padding:17px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:5px;
}

.cart-btn{
  border:0;
  background:#fff;
  color:#000;
  padding:10px 16px;
  border-radius:25px;
  font-weight:bold;
}

.hero{
  background:#0b0b0b;
  color:#fff;
  text-align:center;
  padding:75px 20px;
}

.hero h1{
  font-size:55px;
  letter-spacing:8px;
}

.hero p{
  color:#bbb;
  margin:15px 0 28px;
  letter-spacing:2px;
}

.shop-btn{
  border:0;
  background:#fff;
  color:#000;
  padding:14px 30px;
  border-radius:30px;
  font-weight:bold;
}

.section{
  max-width:1100px;
  margin:auto;
  padding:45px 18px;
}

.section-title{
  text-align:center;
  margin-bottom:30px;
  font-size:30px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:18px;
}

.product{
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
  cursor:pointer;
  transition:.2s;
}

.product:hover{
  transform:translateY(-3px);
}

.product img{
  width:100%;
  height:230px;
  object-fit:cover;
  display:block;
}

.product-info{
  padding:15px;
}

.product-info h3{
  font-size:17px;
  margin-bottom:8px;
}

.price{
  font-size:19px;
  font-weight:bold;
}

.old-price{
  color:#999;
  text-decoration:line-through;
  font-size:14px;
  margin-left:5px;
}

.stock{
  color:#168a35;
  font-size:13px;
  margin-top:7px;
}

/* PRODUCT DETAILS */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.75);
  overflow:auto;
  padding:20px;
}

.modal-box{
  background:#fff;
  max-width:850px;
  margin:30px auto;
  border-radius:18px;
  overflow:hidden;
  position:relative;
}

.close{
  position:absolute;
  right:15px;
  top:15px;
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#000;
  color:#fff;
  font-size:22px;
  z-index:2;
}

.product-details{
  display:grid;
  grid-template-columns:1fr 1fr;
}

.product-details img{
  width:100%;
  height:100%;
  min-height:450px;
  object-fit:cover;
}

.details{
  padding:35px;
}

.details h2{
  font-size:30px;
  margin-bottom:12px;
}

.details-price{
  font-size:27px;
  font-weight:bold;
  margin:15px 0;
}

.details-description{
  color:#555;
  line-height:1.7;
  margin-bottom:20px;
}

.label{
  font-weight:bold;
  margin:15px 0 8px;
}

.size-select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:8px;
}

.action-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:8px;
  margin-top:12px;
  font-weight:bold;
  cursor:pointer;
}

.add-btn{
  background:#000;
  color:#fff;
}

.buy-btn{
  background:#e8e8e8;
  color:#000;
}

/* CART */

.cart-modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:200;
}

.cart-box{
  background:#fff;
  width:min(430px,100%);
  height:100%;
  margin-left:auto;
  padding:25px;
  overflow:auto;
}

.cart-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.cart-close{
  border:0;
  background:none;
  font-size:28px;
}

.cart-item{
  border-bottom:1px solid #ddd;
  padding:15px 0;
}

.total{
  font-size:22px;
  font-weight:bold;
  margin:25px 0;
}

.checkout-btn{
  width:100%;
  padding:15px;
  background:#000;
  color:#fff;
  border:0;
  border-radius:8px;
  font-weight:bold;
}

.checkout-form{
  display:none;
  margin-top:25px;
}

.checkout-form input,
.checkout-form textarea,
.checkout-form select{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:8px;
}

footer{
  background:#000;
  color:#aaa;
  text-align:center;
  padding:35px;
}

footer strong{
  color:#fff;
  font-size:25px;
  letter-spacing:4px;
}

@media(max-width:650px){

  .hero h1{
    font-size:40px;
  }

  .product-details{
    grid-template-columns:1fr;
  }

  .product-details img{
    min-height:330px;
    height:330px;
  }

  .details{
    padding:25px;
  }

  .details h2{
    font-size:25px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">ZYNO</div>

  <button class="cart-btn" onclick="openCart()">
    🛒 Cart (<span id="cartCount">0</span>)
  </button>
</header>

<section class="hero">
  <h1>ZYNO</h1>
  <p>WEAR YOUR IDENTITY.</p>

  <button class="shop-btn"
  onclick="document.getElementById('products').scrollIntoView()">
    SHOP NOW
  </button>
</section>

<section class="section" id="products">

  <h2 class="section-title">NEW COLLECTION</h2>

  <div class="products">

    <!-- PRODUCT 1 -->

    <div class="product"
    onclick="showProduct(0)">

      <img
      src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80"
      alt="ZYNO Classic T-Shirt">

      <div class="product-info">

        <h3>ZYNO Classic T-Shirt</h3>

        <div class="price">
          ₹599
          <span class="old-price">₹799</span>
        </div>

        <div class="stock">
          ● In Stock
        </div>

      </div>
    </div>


    <!-- PRODUCT 2 -->

    <div class="product"
    onclick="showProduct(1)">

      <img
      src="https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=800&q=80"
      alt="ZYNO Oversized Tee">

      <div class="product-info">

        <h3>ZYNO Oversized Tee</h3>

        <div class="price">
          ₹699
          <span class="old-price">₹899</span>
        </div>

        <div class="stock">
          ● In Stock
        </div>

      </div>
    </div>


    <!-- PRODUCT 3 -->

    <div class="product"
    onclick="showProduct(2)">

      <img
      src="https://images.unsplash.com/photo-1576566588028-4147f3842f27?auto=format&fit=crop&w=800&q=80"
      alt="ZYNO Premium Tee">

      <div class="product-info">

        <h3>ZYNO Premium Tee</h3>

        <div class="price">
          ₹799
          <span class="old-price">₹999</span>
        </div>

        <div class="stock">
          ● In Stock
        </div>

      </div>
    </div>

  </div>

</section>


<!-- PRODUCT DETAILS MODAL -->

<div class="modal" id="productModal">

  <div class="modal-box">

    <button class="close" onclick="closeProduct()">
      ×
    </button>

    <div class="product-details">

      <img id="detailImage" src="" alt="Product">

      <div class="details">

        <h2 id="detailName"></h2>

        <div class="details-price">
          ₹<span id="detailPrice"></span>
        </div>

        <p class="details-description"
        id="detailDescription"></p>

        <div class="label">
          Select Size
        </div>

        <select id="detailSize" class="size-select">

          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
          <option value="XXL">XXL</option>

        </select>

        <div class="label">
          Availability
        </div>

        <p style="color:#168a35;">
          ✓ In Stock
        </p>

        <button class="action-btn add-btn"
        onclick="addSelectedProduct()">
          ADD TO CART
        </button>

        <button class="action-btn buy-btn"
        onclick="buyNow()">
          BUY NOW
        </button>

      </div>

    </div>

  </div>

</div>


<!-- CART -->

<div class="cart-modal" id="cartModal">

  <div class="cart-box">

    <div class="cart-top">

      <h2>Your Cart</h2>

      <button class="cart-close"
      onclick="closeCart()">
        ×
      </button>

    </div>

    <div id="cartItems"></div>

    <div class="total">
      Total: ₹<span id="cartTotal">0</span>
    </div>

    <button class="checkout-btn"
    onclick="showCheckout()">
      PROCEED TO CHECKOUT
    </button>


    <div class="checkout-form" id="checkoutForm">

      <h3>Delivery Details</h3>

      <input
      id="customerName"
      placeholder="Full Name">

      <input
      id="customerPhone"
      placeholder="Mobile Number">

      <textarea
      id="customerAddress"
      rows="4"
      placeholder="Full Delivery Address"></textarea>

      <input
      id="customerPin"
      placeholder="PIN Code">

      <select id="paymentMethod">

        <option value="COD">
          Cash on Delivery
        </option>

        <option value="UPI">
          UPI / Online Payment
        </option>

      </select>

      <button class="checkout-btn"
      onclick="placeOrder()">
        PLACE ORDER
      </button>

    </div>

  </div>

</div>


<footer>

  <strong>ZYNO</strong>

  <br><br>

  Premium Clothing Brand

  <br><br>

  © 2026 ZYNO

</footer>


<script>

/* PRODUCT DATABASE */

const products = [

  {
    name:"ZYNO Classic T-Shirt",

    price:599,

    image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80",

    description:
    "Premium everyday T-shirt from ZYNO. Comfortable fabric, modern fit and clean minimal design. Perfect for casual everyday wear.",

    stock:true
  },

  {
    name:"ZYNO Oversized Tee",

    price:699,

    image:"https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=800&q=80",

    description:
    "Premium oversized T-shirt designed for a relaxed streetwear look. Soft fabric with a comfortable oversized fit.",

    stock:true
  },

  {
    name:"ZYNO Premium Tee",

    price:799,

    image:"https://images.unsplash.com/photo-1576566588028-4147f3842f27?auto=format&fit=crop&w=800&q=80",

    description:
    "A premium ZYNO T-shirt featuring a clean luxury-inspired style and comfortable fabric for everyday fashion.",

    stock:true
  }

];


let selectedProduct = null;

let cart = [];


/* SHOW PRODUCT DETAILS */

function showProduct(index){

  selectedProduct = products[index];

  document.getElementById("detailImage").src =
  selectedProduct.image;

  document.getElementById("detailName").innerText =
  selectedProduct.name;

  document.getElementById("detailPrice").innerText =
  selectedProduct.price;

  document.getElementById("detailDescription").innerText =
  selectedProduct.description;

  document.getElementById("productModal").style.display =
  "block";

  document.body.style.overflow="hidden";
}


/* CLOSE PRODUCT */

function closeProduct(){

  document.getElementById("productModal").style.display =
  "none";

  document.body.style.overflow="auto";
}


/* ADD PRODUCT */

function addSelectedProduct(){

  if(!selectedProduct) return;

  const size =
  document.getElementById("detailSize").value;

  cart.push({

    name:selectedProduct.name,

    price:selectedProduct.price,

    size:size

  });

  updateCart();

  closeProduct();

  alert("Product added to cart!");
}


/* BUY NOW */

function buyNow(){

  addSelectedProduct();

  openCart();

  showCheckout();

}


/* UPDATE CART */

function updateCart(){

  document.getElementById("cartCount").innerText =
  cart.length;

  let html="";

  let total=0;

  cart.forEach((item,index)=>{

    total += item.price;

    html += `

      <div class="cart-item">

        <strong>${item.name}</strong>

        <br>

        Size: ${item.size}

        <br>

        ₹${item.price}

        <br><br>

        <button
        onclick="removeItem(${index})"
        style="border:0;background:#eee;padding:7px 12px;border-radius:6px;">

        Remove

        </button>

      </div>

    `;

  });

  document.getElementById("cartItems").innerHTML =
  html || "<p>Your cart is empty.</p>";

  document.getElementById("cartTotal").innerText =
  total;

}


/* REMOVE ITEM */

function removeItem(index){

  cart.splice(index,1);

  updateCart();

}


/* OPEN CART */

function openCart(){

  document.getElementById("cartModal").style.display =
  "block";

}


/* CLOSE CART */

function closeCart(){

  document.getElementById("cartModal").style.display =
  "none";

}


/* CHECKOUT */

function showCheckout(){

  if(cart.length===0){

    alert("Your cart is empty.");

    return;

  }

  document.getElementById("checkoutForm").style.display =
  "block";

}


/* PLACE ORDER */

function placeOrder(){

  const name =
  document.getElementById("customerName").value.trim();

  const phone =
  document.getElementById("customerPhone").value.trim();

  const address =
  document.getElementById("customerAddress").value.trim();

  const pin =
  document.getElementById("customerPin").value.trim();

  const payment =
  document.getElementById("paymentMethod").value;


  if(!name || !phone || !address || !pin){

    alert("Please fill all delivery details.");

    return;

  }


  const orderId =
  "ZYNO" + Date.now();


  let total=0;

  cart.forEach(item=>{
    total += item.price;
  });


  alert(

    "Order placed successfully!\\n\\n"+

    "Order ID: "+orderId+"\\n"+

    "Customer: "+name+"\\n"+

    "Total: ₹"+total+"\\n"+

    "Payment: "+payment

  );


  cart=[];

  updateCart();

  closeCart();

}


</script>

</body>
</html>
